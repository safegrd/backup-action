name: Test

# Runs the action from this checkout with a host set up by `safegrd init`:
# local storage and no remote server, so it needs no account and no secrets.
# The PostgreSQL job backs up, drills into a sandbox database the action
# creates, then drills again in memory with the key passed as an input. The
# MySQL and MongoDB jobs back up and drill into a sandbox on the same server.
# The files job backs up a folder of this checkout as a surface and drills it
# in memory. A standalone host reports to no remote server, so each drill
# shows a "not recorded" warning; that is expected.
#
# The CLI's release calls this workflow before it publishes anything, with the
# archives it built as an artifact of its run: every job then installs those
# instead of the latest release, through SAFEGRD_DOWNLOAD_BASE, so a CLI release
# that breaks this action is never published.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      cli-version:
        description: The CLI release under test, such as v0.0.11. Empty tests the latest release.
        type: string
        default: ""
      dist-artifact:
        description: An artifact of the calling run holding that release's archives and checksums.txt.
        type: string
        default: ""
      action-ref:
        description: The ref of safegrd/backup-action whose action and scripts are tested.
        type: string
        default: v0

permissions:
  contents: read

jobs:
  action:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 24
    env:
      ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      APP_URL: postgres://postgres:postgres@localhost:5432/app?sslmode=disable
    steps:
      # Called from another repository, a checkout defaults to the caller's.
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.cli-version != '' && 'safegrd/backup-action' || github.repository }}
          ref: ${{ inputs.cli-version != '' && inputs.action-ref || '' }}

      - name: Fetch the CLI under test
        if: inputs.dist-artifact != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.dist-artifact }}
          path: ${{ runner.temp }}/safegrd-dist

      - name: Install it instead of the published release
        if: inputs.dist-artifact != ''
        run: echo "SAFEGRD_DOWNLOAD_BASE=file://$RUNNER_TEMP/safegrd-dist" >>"$GITHUB_ENV"

      - name: Seed a database to back up
        run: |
          psql "$ADMIN_URL" -c "CREATE DATABASE app"
          psql "$APP_URL" -c "CREATE TABLE orders (id serial PRIMARY KEY, total bigint NOT NULL)" \
            -c "INSERT INTO orders (total) SELECT g FROM generate_series(1, 250) g"

      - name: Set up a standalone host
        id: host
        env:
          SAFEGRD_VERSION: ${{ inputs.cli-version || 'latest' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/install-safegrd.sh
          export PATH="$RUNNER_TEMP/safegrd-bin:$PATH"
          dir="$RUNNER_TEMP/host"
          safegrd init --config "$dir/safegrd.yaml" --storage local --local-path "$dir/storage" --node-name action-test
          {
            echo "config<<SAFEGRD_EOF"
            cat "$dir/safegrd.yaml"
            echo "SAFEGRD_EOF"
          } >>"$GITHUB_OUTPUT"

      - name: Back up and drill into a sandbox
        id: sandbox
        uses: ./
        with:
          version: ${{ inputs.cli-version || 'latest' }}
          config: ${{ steps.host.outputs.config }}
          database-url: ${{ env.APP_URL }}
          drill: true
          sandbox-url: postgres://postgres:postgres@localhost:5432/drill?sslmode=disable

      - name: Check the sandbox holds the rows
        run: |
          rows="$(psql "postgres://postgres:postgres@localhost:5432/drill?sslmode=disable" -tAc "SELECT count(*) FROM orders")"
          test "$rows" = "250" || { echo "::error::The sandbox holds $rows rows, not 250."; exit 1; }

      - name: Move the key out of the config's reach
        id: key
        run: |
          dir="$RUNNER_TEMP/host"
          # The log lists a step's inputs, so the key is masked first.
          echo "::add-mask::$(grep '^AGE-SECRET-KEY-' "$dir/keys/daemon.key")"
          {
            echo "identity<<SAFEGRD_EOF"
            cat "$dir/keys/daemon.key"
            echo "SAFEGRD_EOF"
          } >>"$GITHUB_OUTPUT"
          rm "$dir/keys/daemon.key"

      - name: Back up and drill in memory, with the key as an input
        id: memory
        uses: ./
        with:
          version: ${{ inputs.cli-version || 'latest' }}
          config: ${{ steps.host.outputs.config }}
          database-url: ${{ env.APP_URL }}
          drill: true
          private-key: ${{ steps.key.outputs.identity }}
          postgres-version: none

      - name: Check each run took its own snapshot
        env:
          FIRST: ${{ steps.sandbox.outputs.snapshot-id }}
          SECOND: ${{ steps.memory.outputs.snapshot-id }}
        run: |
          test -n "$FIRST" && test -n "$SECOND" && test "$FIRST" != "$SECOND" ||
            { echo "::error::snapshot-id was '$FIRST' then '$SECOND'."; exit 1; }

  mysql:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: mysql
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pmysql" --health-interval 5s
          --health-timeout 5s --health-retries 24
    env:
      MYSQL_PWD: mysql
    steps:
      # Called from another repository, a checkout defaults to the caller's.
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.cli-version != '' && 'safegrd/backup-action' || github.repository }}
          ref: ${{ inputs.cli-version != '' && inputs.action-ref || '' }}

      - name: Fetch the CLI under test
        if: inputs.dist-artifact != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.dist-artifact }}
          path: ${{ runner.temp }}/safegrd-dist

      - name: Install it instead of the published release
        if: inputs.dist-artifact != ''
        run: echo "SAFEGRD_DOWNLOAD_BASE=file://$RUNNER_TEMP/safegrd-dist" >>"$GITHUB_ENV"

      - name: Seed a database to back up
        run: |
          mysql -h 127.0.0.1 -u root -e "CREATE DATABASE app"
          mysql -h 127.0.0.1 -u root app -e "
            CREATE TABLE orders (id INT AUTO_INCREMENT PRIMARY KEY, total BIGINT NOT NULL);
            INSERT INTO orders (total)
              WITH RECURSIVE g (n) AS (SELECT 1 UNION ALL SELECT n + 1 FROM g WHERE n < 250) SELECT n FROM g;"

      - name: Set up a standalone host
        id: host
        env:
          SAFEGRD_VERSION: ${{ inputs.cli-version || 'latest' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/install-safegrd.sh
          export PATH="$RUNNER_TEMP/safegrd-bin:$PATH"
          dir="$RUNNER_TEMP/host"
          safegrd init --config "$dir/safegrd.yaml" --storage local --local-path "$dir/storage" --node-name action-mysql
          {
            echo "config<<SAFEGRD_EOF"
            cat "$dir/safegrd.yaml"
            echo "SAFEGRD_EOF"
          } >>"$GITHUB_OUTPUT"

      - name: Back up and drill into a sandbox
        uses: ./
        with:
          version: ${{ inputs.cli-version || 'latest' }}
          config: ${{ steps.host.outputs.config }}
          database-url: mysql://root:mysql@127.0.0.1:3306/app
          drill: true
          sandbox-url: mysql://root:mysql@127.0.0.1:3306/drill

      - name: Check the sandbox holds the rows
        run: |
          rows="$(mysql -h 127.0.0.1 -u root -N -B drill -e "SELECT COUNT(*) FROM orders")"
          test "$rows" = "250" || { echo "::error::The sandbox holds $rows rows, not 250."; exit 1; }

  mongodb:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mongo:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'" --health-interval 5s
          --health-timeout 5s --health-retries 24
    steps:
      # Called from another repository, a checkout defaults to the caller's.
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.cli-version != '' && 'safegrd/backup-action' || github.repository }}
          ref: ${{ inputs.cli-version != '' && inputs.action-ref || '' }}

      - name: Fetch the CLI under test
        if: inputs.dist-artifact != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.dist-artifact }}
          path: ${{ runner.temp }}/safegrd-dist

      - name: Install it instead of the published release
        if: inputs.dist-artifact != ''
        run: echo "SAFEGRD_DOWNLOAD_BASE=file://$RUNNER_TEMP/safegrd-dist" >>"$GITHUB_ENV"

      - name: Seed a database to back up
        run: |
          docker exec "${{ job.services.mongo.id }}" mongosh --quiet app \
            --eval 'db.orders.insertMany(Array.from({ length: 250 }, (_, i) => ({ n: i + 1 })))'

      - name: Set up a standalone host
        id: host
        env:
          SAFEGRD_VERSION: ${{ inputs.cli-version || 'latest' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/install-safegrd.sh
          export PATH="$RUNNER_TEMP/safegrd-bin:$PATH"
          dir="$RUNNER_TEMP/host"
          safegrd init --config "$dir/safegrd.yaml" --storage local --local-path "$dir/storage" --node-name action-mongodb
          {
            echo "config<<SAFEGRD_EOF"
            cat "$dir/safegrd.yaml"
            echo "SAFEGRD_EOF"
          } >>"$GITHUB_OUTPUT"

      - name: Back up and drill into a sandbox
        uses: ./
        with:
          version: ${{ inputs.cli-version || 'latest' }}
          config: ${{ steps.host.outputs.config }}
          database-url: mongodb://127.0.0.1:27017/app
          drill: true
          sandbox-url: mongodb://127.0.0.1:27017/drill

      - name: Check the sandbox holds the documents
        run: |
          docs="$(docker exec "${{ job.services.mongo.id }}" mongosh --quiet drill --eval 'db.orders.countDocuments()')"
          test "$docs" = "250" || { echo "::error::The sandbox holds $docs documents, not 250."; exit 1; }

  files:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Called from another repository, a checkout defaults to the caller's.
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.cli-version != '' && 'safegrd/backup-action' || github.repository }}
          ref: ${{ inputs.cli-version != '' && inputs.action-ref || '' }}

      - name: Fetch the CLI under test
        if: inputs.dist-artifact != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.dist-artifact }}
          path: ${{ runner.temp }}/safegrd-dist

      - name: Install it instead of the published release
        if: inputs.dist-artifact != ''
        run: echo "SAFEGRD_DOWNLOAD_BASE=file://$RUNNER_TEMP/safegrd-dist" >>"$GITHUB_ENV"

      - name: Make a folder to back up
        run: |
          mkdir -p site/assets
          for i in $(seq 1 40); do echo "page $i" >"site/page-$i.html"; done
          head -c 100000 /dev/urandom >site/assets/blob.bin

      - name: Set up a standalone host with a files surface
        id: host
        env:
          SAFEGRD_VERSION: ${{ inputs.cli-version || 'latest' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/install-safegrd.sh
          export PATH="$RUNNER_TEMP/safegrd-bin:$PATH"
          dir="$RUNNER_TEMP/host"
          safegrd init --config "$dir/safegrd.yaml" --storage local --local-path "$dir/storage" --node-name action-files
          cat >>"$dir/safegrd.yaml" <<'EOF'
          surfaces:
            - id: site
              type: files
              format: tar
              roots: [site]
          EOF
          {
            echo "config<<SAFEGRD_EOF"
            cat "$dir/safegrd.yaml"
            echo "SAFEGRD_EOF"
          } >>"$GITHUB_OUTPUT"

      - name: Back up the folder and drill it
        id: files
        uses: ./
        with:
          version: ${{ inputs.cli-version || 'latest' }}
          config: ${{ steps.host.outputs.config }}
          surface: site
          drill: true

      - name: Check the run took a snapshot
        env:
          SNAPSHOT: ${{ steps.files.outputs.snapshot-id }}
        run: |
          test -n "$SNAPSHOT" || { echo "::error::snapshot-id is empty."; exit 1; }
